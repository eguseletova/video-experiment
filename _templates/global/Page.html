{{ extends "otree/Page.html" }}

{{ block global_styles }}
<link rel="stylesheet" href="{{ static 'global/survey.css' }}?v={{ session.config.asset_version }}">
{{ endblock }}

{{ block global_scripts }}
{{ if session.config.walkthrough }}<script>window.WALKTHROUGH = true;</script>{{ endif }}
{{ if session.config.anti_cheat }}<script>window.ANTI_CHEAT = true;</script>{{ endif }}
<script src="{{ static 'global/js/anticheat.js' }}?v={{ session.config.asset_version }}"></script>
<script src="{{ static 'global/survey.js' }}?v={{ session.config.asset_version }}"></script>
<script src="{{ static 'global/js/walkthrough.js' }}?v={{ session.config.asset_version }}"></script>
{{ endblock }}
