# Render Blueprint: free demo deployment (for showing the survey to coauthors).
#
# Free tier: the server sleeps after ~15 min without visitors (the first visit
# then takes ~1 min), and survey data are wiped whenever it sleeps, restarts or
# redeploys. Videos are uploaded to Box (if the BOX_* values are filled in), so
# they are kept. Do NOT use this setup for real data collection.
#
# The small Postgres database only stores the Box login (oTree itself uses a
# temporary SQLite file here). Render deletes free databases after 30 days;
# then recreate it and paste a new BOX_REFRESH_TOKEN (see README).
services:
  - type: web
    name: video-experiment-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: otree prodserver1of2
    healthCheckPath: /demo
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: OTREE_PRODUCTION
        value: "1"
      # DEMO: anyone with the link can use the demo page; the admin pages need the password
      - key: OTREE_AUTH_LEVEL
        value: DEMO
      - key: OTREE_SECRET_KEY
        generateValue: true
      # "sync: false" = Render asks you to type the value in when you create the service
      - key: OTREE_ADMIN_PASSWORD
        sync: false
      - key: BOX_CLIENT_ID
        sync: false
      - key: BOX_CLIENT_SECRET
        sync: false
      - key: BOX_FOLDER_ID
        sync: false
      - key: BOX_REFRESH_TOKEN
        sync: false
      - key: BOX_TOKEN_DB_URL
        fromDatabase:
          name: video-experiment-box-login
          property: connectionString

databases:
  - name: video-experiment-box-login
    plan: free
    ipAllowList: []  # only reachable from the Render service itself
